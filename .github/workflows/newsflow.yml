name: newsflow

on:
  schedule:
    # Every 15 minutes. Free on a PUBLIC repository (unlimited Actions minutes). On a private
    # repository use hourly ("7 * * * *") with --all-routes to stay inside the free 2,000 minutes
    # a month (see RUNBOOK.md). GitHub may delay scheduled runs by a few minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Widen the window to N days (use 30 on the very first run to seed the pile)"
        required: false
        default: ""
      allow_state_reset:
        description: "Accept a database that has gone backwards (only after a cache loss; the engine will re-report recent items once)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write        # the failure alert opens or comments on an issue

concurrency:
  group: newsflow-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The SQLite database is carried between runs in the Actions cache (a new key every run,
      # restored by prefix). It is also committed once a day as a backup, and the checkout above
      # has already put that backup at data/newsflow.db.
      #
      # A prefix restore returns any surviving entry, not necessarily the newest, and at ~96 runs
      # a day against a 10GB repository cache the older entries are evicted constantly. So the
      # committed backup is moved aside BEFORE the restore rather than being overwritten by it,
      # and the two copies are compared afterwards. Do not "protect" the backup by restoring the
      # cache to a different path instead: the cache must be restored to exactly the path it was
      # saved from, or the entry does not match and every run starts from nothing.
      - name: Set the committed backup aside
        run: |
          if [ -f data/newsflow.db ]; then
            mkdir -p data/backup
            mv data/newsflow.db data/backup/newsflow.db
            echo "committed backup moved to data/backup/newsflow.db"
          else
            echo "no committed backup in this checkout"
          fi

      - name: Restore database from the cache
        uses: actions/cache/restore@v4
        with:
          path: data/newsflow.db
          key: newsflow-db-v2-${{ github.run_id }}
          restore-keys: newsflow-db-v2-

      # Keep whichever of the two copies has seen more runs. Both counters only ever increase.
      - name: Use the newer of the cache and the committed backup
        run: python -m newsflow pick-db --candidate data/backup/newsflow.db --target data/newsflow.db

      - name: Run engine
        id: engine
        env:
          NEWSFLOW_WEBHOOK_URL: ${{ secrets.NEWSFLOW_WEBHOOK_URL }}
          NEWSFLOW_SMTP_PASSWORD: ${{ secrets.NEWSFLOW_SMTP_PASSWORD }}
          # Only ever set by a manual run with the box ticked. It turns off the guard that refuses
          # to start on state older than the last published export.
          NEWSFLOW_ALLOW_STATE_RESET: ${{ github.event.inputs.allow_state_reset == 'true' && '1' || '' }}
        run: |
          # Scheduled runs follow the every_n_runs cadences in config/newsflow.yaml (tuned for 15 minutes).
          # Manual runs use --all-routes so every route runs; add backfill_days to widen the windows.
          if [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            python -m newsflow run --all-routes --backfill-days "${{ github.event.inputs.backfill_days }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m newsflow run --all-routes
          else
            python -m newsflow run
          fi

      # A monitor that fails quietly is worse than no monitor, because you trust it. The engine
      # can exit 0 having fetched nothing at all: every route refused, the database missing, the
      # config loading no names. None of that raises an error on its own, so assert it here.
      - name: Assert the run actually produced something
        run: |
          python - <<'PY'
          import sqlite3, sys, os
          db = "data/newsflow.db"
          if not os.path.exists(db):
              sys.exit("FAIL: no database after the run; nothing was stored")
          c = sqlite3.connect(db)
          c.row_factory = sqlite3.Row
          run = c.execute("SELECT * FROM runs ORDER BY id DESC LIMIT 1").fetchone()
          if run is None:
              sys.exit("FAIL: the runs table is empty; the engine stored nothing")
          fetched = run["items_fetched"] or 0
          notes = run["notes"] or ""
          print(f"run {run['id']} at {run['started_at']}: fetched={fetched} {notes}")

          # Which routes answered at all this run
          rows = c.execute(
              "SELECT route, SUM(items) items, COUNT(*) jobs FROM source_results "
              "WHERE run_id=? GROUP BY route", (run["id"],)).fetchall()
          for r in rows:
              print(f"  {r['route']:12} jobs={r['jobs']:5} items={r['items'] or 0}")
          live = [r["route"] for r in rows if (r["items"] or 0) > 0]

          if fetched == 0 and not live:
              sys.exit("FAIL: every route returned nothing. This is an outage, not a quiet news day.")
          if "tripped=" in notes:
              print(f"::warning::a route was tripped for being refused upstream: {notes}")
          if not live:
              sys.exit("FAIL: no route produced a single item this run")
          PY

      # Save whatever the engine collected, including on a run the assertion step above flagged as
      # an outage: that database still holds the new seen_links. Do NOT save when the engine
      # refused to start on rolled-back state, or the stale copy gets a fresh cache key and
      # outlives the good one.
      - name: Save database
        uses: actions/cache/save@v4
        if: always() && steps.engine.outcome == 'success'
        with:
          path: data/newsflow.db
          key: newsflow-db-v2-${{ github.run_id }}

      - name: Commit outputs
        if: always()
        run: |
          git config user.name "newsflow-bot"
          git config user.email "newsflow-bot@users.noreply.github.com"
          git add docs
          # back the database up in git once a day (first run after 00:00 UTC) or on a manual run
          if [ "$(date -u +%H)" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add -f data/newsflow.db
          fi
          git commit -m "newsflow run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "nothing to commit"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push

      # Make failures shout. GitHub emails the repository owner when an issue is opened or
      # commented on, so this reaches you without configuring a webhook or SMTP. One open issue
      # is reused for consecutive failures so a sustained outage does not create 96 issues a day.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh label create newsflow-failure --color B60205 \
            --description "The newsflow engine failed a scheduled run" >/dev/null 2>&1
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf '%s\n' \
            "The scheduled newsflow run failed at $(date -u +%Y-%m-%dT%H:%MZ)." \
            "" \
            "Run log: $url" \
            "" \
            "Nothing new was collected on this cycle. If this repeats, the engine is down and the" \
            "absence of a brief is not a quiet news day.")
          existing=$(gh issue list --label newsflow-failure --state open --limit 1 \
            --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "newsflow engine failed" --body "$body" \
              --label newsflow-failure
          fi

      # Close the alert once a run succeeds again, so an open issue always means "broken now".
      - name: Clear the alert on a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          existing=$(gh issue list --label newsflow-failure --state open --limit 1 \
            --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Recovered: run ${{ github.run_id }} succeeded."
          fi
