name: cleanup-root

# One-shot housekeeping. The repository root accumulated 48 stray files from misplaced uploads:
# 46 name configs that belong in config/names/, plus build_universe.py (belongs in scripts/) and
# test_units.py (belongs in tests/). Every one is a stale duplicate; the copies in their proper
# folders are newer and are the ones the engine and CI actually read.
#
# Run this once from the Actions tab. It deletes exactly the files listed below, refuses to touch
# anything whose proper copy is missing, and removes itself in the same commit so it cannot be
# run again by accident. Nothing is lost: git keeps every deleted version in history.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete the stray root files
        run: |
          set -euo pipefail

          # Each entry is "stray-path proper-path". A stray file is only deleted if its proper
          # copy is present, so a typo here removes nothing.
          PAIRS="
          build_universe.py scripts/build_universe.py
          test_units.py tests/test_units.py
          "
          for n in adidas asda ashtead azelis barrattredrow bellway bertrand birkenstock boels \
                   boots brenntag coop crocs deckers demire drmartens froneri goldengoose \
                   icelandfoods imcd keepmoat kiloutou lowell loxam manuchar morrisons nike \
                   onholding paragon persimmon puma quick rekeep sainsburys skechers sudzucker \
                   superdrug synlab taylorwimpey tesco tmicc unilever unitedrentals univar \
                   vistry walgreens; do
            PAIRS="$PAIRS
          $n.yaml config/names/$n.yaml"
          done

          removed=0
          skipped=0
          while read -r stray proper; do
            [ -z "$stray" ] && continue
            if [ ! -f "$stray" ]; then
              echo "already gone: $stray"; continue
            fi
            if [ ! -f "$proper" ]; then
              echo "::warning::KEEPING $stray - its proper copy $proper does not exist"
              skipped=$((skipped + 1)); continue
            fi
            git rm -q "$stray"
            echo "removed $stray (kept $proper)"
            removed=$((removed + 1))
          done <<< "$PAIRS"

          echo "removed=$removed skipped=$skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped file(s) were kept because their proper copy is missing"
            exit 1
          fi

          # Remove this workflow too, so the cleanup is a single closed event.
          git rm -q --ignore-unmatch .github/workflows/cleanup-root.yml

          git config user.name "newsflow-bot"
          git config user.email "newsflow-bot@users.noreply.github.com"
          git commit -m "Remove $removed stray duplicate files from the repository root

          They were left by misplaced uploads. The live copies under config/names/, scripts/ and
          tests/ are newer and are what the engine and CI read. [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
