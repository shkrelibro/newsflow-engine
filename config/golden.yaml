# The golden set: real events the engine must have caught. Checked against the store after every
# run; results go to docs/golden.json and onto the workflow log. A miss is the most useful thing
# this system can tell you, because it names a hole in coverage with a real example.
#
# Maintain it. When you know something happened, add it with the date. Leave a documented miss
# in place with `expect: miss`; the day it turns into a hit is the day that hole is closed.
#
#   id            a short slug
#   name          the config/names id
#   date          the day the story broke, UTC
#   contains      every fragment must appear in one headline, case-insensitive
#   any_of        alternatively, any one of these fragments (use for multilingual stories)
#   within_hours  how soon after 00:00Z on `date` it should have been seen (default 24)
#   expect        hit (default) or miss, for a hole you already know about
#   note          why it matters

