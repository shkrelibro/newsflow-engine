    pages:
      - {url: "https://www.investegate.co.uk/company/ABF", name: "Associated British Foods RNS (Investegate)", tier: 0, country: "GB", lang: en, require_alias: false, link_pattern: 'investegate\.co\.uk/announcement/rns/associated\-british\-foods\-\-abf/.+'}
