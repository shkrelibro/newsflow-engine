# Primary-source layer: each name's own newsroom, investor page, regulatory venue and RSS feed.
#
# Loaded by newsflow/config.py and merged into the name's pages and feeds at load time. It lives
# here, not in config/names/*.yaml, because scripts/build_universe.py rewrites those files and
# silently dropped hand-added watchers on 21 September. This file is never touched by the generator.
#
# Rules: an entry needs a URL that was fetched and shown to list article links, and a link_pattern
# derived from real links on that page. Entries without that evidence sit in primary_candidates.yaml
# (not loaded) until scripts/check_primary.py has seen links on them. tier 0 = the company's own
# source. require_alias false = every new link on a company-specific page is about the company;
# the export keeps such rows even when the headline does not name the company.
#
# link_pattern is a regex tested with re.search against each link on the page. Single quotes keep
# backslashes literal. The first visit only seeds (marks every link seen); items start on the second.

version: 1
names:
