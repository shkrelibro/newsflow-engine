# Shared outlet list: national business press (tier 3), trade press (tier 4) and regional titles near
# known Intrum sites (tier 5) per country. feed_url may be left blank: `newsflow discover-feeds` looks
# for <link rel=alternate> and common paths, and the engine retries discovery daily. Outlets without a
# feed are still covered by the Google News site: queries listed per name. Every item from these feeds
# is matched against every name. Country keys are quoted because YAML reads a bare NO as "false".
