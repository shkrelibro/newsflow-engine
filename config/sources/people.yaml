# Executives per name id, merged into each name's aliases at load time (newsflow/config.py,
# _merge_people). Added 11 October 2026 after the engine missed that a Welt am Sonntag interview
# with Vonovia's chief executive had broken: its echoes ran under his name ("Mucic stoppt Neubau in
# Berlin"), not the company's.
#
# Rules: names are the CURRENT CEO / CFO as confirmed from a 2025-26 source or the company's own
# management page on 11 October 2026 (source noted per line). Full names only for text; a surname is
# added as a separate match-only alias ONLY where it is distinctive enough that a headline carrying
# it is about this person (no Franchi, Ebel, Samson, Wood). search: true runs a Google News query for
# the name in the home language every 4th run; CFOs are match-only. Update this file when an
# executive changes; a stale name costs recall, a wrong one costs precision.
names:
  vonovia:      # vonovia.com management board, Q1 2026 release
    people:
      - {text: "Luka Mucic", search: true, search_every: 4, langs: [de]}
      - {text: "Mucic", search: false}
      - {text: "Philip Grosse", search: false}
  synlab:       # synlab.com, 2 Apr 2025
