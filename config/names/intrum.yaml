# Intrum AB (publ) — built from the entity master on 22 Aug 2026.
id: intrum
name: Intrum AB
kind: name
home_country: SE
notes: >
  Credit management services / debt purchasing. Nasdaq Stockholm INTRUM (ISIN SE0000936478).
  20 countries per intrum.com/our-locations plus Ireland. Baltic collections business sold to
  Aktiva Finance Group (2023-24); Vilnius shared-service centre remains, so Lithuanian press is swept.

# Every market is swept in its own language on every run. This list is the footprint, never a subset.
markets:
  - {country: SE, lang: sv}
  - {country: GB, lang: en}      # global English coverage (Bloomberg, Reuters, FT) lands here
  - {country: IE, lang: en}
  - {country: FI, lang: fi}
  - {country: DK, lang: da}
  - {country: "NO", lang: nb}        # quoted: YAML reads a bare NO as false
  - {country: DE, lang: de}
  - {country: AT, lang: de}
  - {country: CH, lang: de}
  - {country: CH, lang: fr}
  - {country: NL, lang: nl}
  - {country: BE, lang: nl}
  - {country: BE, lang: fr}
  - {country: FR, lang: fr}
  - {country: IT, lang: it}
  - {country: ES, lang: es}
  - {country: PT, lang: pt}
  - {country: GR, lang: el}
  - {country: HU, lang: hu}
  - {country: PL, lang: pl}
  - {country: CZ, lang: cs}
  - {country: SK, lang: sk}
  - {country: LT, lang: lt}

aliases:
  # searched (queries run on Google News / Bing / GDELT) and matched
  - {text: "Intrum", inflect: true, search: true}                 # Intrums, Intrumin, Intrumille, Intrum-Aktie, Intrum Hellas ...
  - {text: "Intrum Justitia", search: true, search_every: 8}      # former name; German stock sites and older CEE press still use it
  - {text: "Intrum Hellas", langs: [el, en], search: true, search_every: 2}
  - {text: "Solvia", langs: [es], weight: 0.8, search: true, search_every: 4,
     require_context: ["Intrum", "servicer", "inmobiliaria", "cartera", "NPL", "Sabadell", "activos", "Tellado"]}
  - {text: "Ophelos", weight: 0.8, langs: [en, nl, fr, es, pt, it, el, de], search: true, search_every: 8,
     require_context: ["Intrum", "debt", "collection", "collections", "incasso", "recouvrement", "cobro", "cobrança", "recupero", "Inkasso", "οφειλ"]}   # a Brazilian police operation is also called Óphelos
  # matched only
  - {text: "Ίντρουμ", langs: [el]}
  - {text: "Lindorff", weight: 0.6, require_context: ["Intrum"]}
  - {text: "Aktua", langs: [es], weight: 0.6, require_context: ["Intrum", "Solvia", "servicer", "NPL"]}
  - {text: "Haya Real Estate", langs: [es], weight: 0.7, require_context: ["Intrum", "Solvia"]}
  - {text: "eCollect", langs: [de, en, fr], weight: 0.6, require_context: ["Intrum"]}

# People: distinctive names match on their own (weight < 1 so the company alias wins when both appear);
# common names need the company in context.
people:
  - {text: "Johan Åkerblom", weight: 0.7}
  - {text: "Masih Yazdi", weight: 0.7}
  - {text: "Enrique Tellado", langs: [es, en], weight: 0.7}
  - {text: "Enrico Risso", langs: [it, en], weight: 0.7}
  - {text: "Andrés Rubio", weight: 0.6, require_context: ["Intrum"]}
  - {text: "Georgakopoulos", langs: [el, en], weight: 0.6, require_context: ["Intrum", "servicer", "NPL"]}
  - {text: "Γεωργακόπουλος", langs: [el], weight: 0.6, require_context: ["Intrum", "servicer", "NPL", "κόκκιν"]}
  - {text: "Annie Ho", weight: 0.5, require_context: ["Intrum"]}

exclude_terms: []

comps: [dovalue, hoist, lowell, arrow, pra]

