# The desk's focus list: the credits that matter this week (32 from 11 October 2026). Lars sets it;
# it changes weekly.
#
# A focus credit is searched in its home market every run and in every other market every third run
# (45 minutes); its executives and secondary aliases at least hourly. The comps in its name file
# (config/names/<id>.yaml, "comps:") get their own solo home-market query every sixth run (90 minutes)
# instead of riding only on grouped OR queries. Key outlets per credit live in overlay.yaml
# (key_outlets): set them for every name added here. Watching, which keeps every churn-site row, also
# stays in overlay.yaml, for names under live stress.
#
# The brief opens with a focus table, one line per credit on every cut (what is on the page, what is
# new, or measured silence with the key outlets that answered), reviews every focus row, and flags
# focus comps for review at a lower bar.
#
# Format: one name id per line under "names:" (the file stem in config/names). Ids not found are
# reported by `python -m newsflow check-config` and on the brief. Keep the flat "  - id" shape: the
# brief reads this file without a YAML library.
