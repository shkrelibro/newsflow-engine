# newsflow-engine settings. Paths are relative to the repository root.
engine:
  user_agent: "newsflow-engine/0.1 (personal newsflow monitor; +https://github.com/shkrelibro/newsflow-engine)"
  timeout_seconds: 20
  retries: 2
  max_workers: 12             # main lane: page watchers, feeds, outlet RSS (hundreds of different hosts)
  lanes:                      # v2: search hosts get their own small lanes; their throughput is set by
    googlenews: 2             # the per-host spacing below, so more threads there only queue. Before
    bingnews: 1               # this, 4 shared workers slept behind Google's spacing and 69 of 184
    gdelt: 1                  # outlet feeds were skipped on budget every cycle (11 Oct 2026)
  max_run_minutes: 13         # stop starting new fetches after this; what is done is stored and exported, the rest runs next cycle.
                              # 4 Oct: 12 -> 13. The loop cycle is 15 minutes; export and commit take about a minute.
  cold_start_lookback_hours: 744   # first two site-query cycles keep items up to 31 days old
  lookback_hours: 192         # ignore items published earlier than 8 days (covers the 7-day site: queries; backfill overrides)
  cluster_window_hours: 72    # near-duplicate clustering window
  resolve_redirects: false    # try to resolve Google News links to the outlet URL (slower; off on GitHub Actions)
  honour_robots_for_pages: true
  db_path: data/newsflow.db
  keep_source_results_days: 10   # the per-job coverage ledger is ~40,000 rows a day and the
                                 # largest table in the database. Health reads the last few runs
                                 # and coverage reads 24 hours, so older rows are dead weight, and
                                 # a smaller database is what survives the Actions cache. Items,
                                 # clusters and runs are never pruned. 0 disables.
  circuit_breaker:
    enabled: true
    consecutive_empty: 25     # a route answering ok-but-empty this many times in a row is being
                              # refused upstream, not finding nothing; its remaining jobs are
                              # cancelled so the other routes keep the run's time budget
    routes: [googlenews, bingnews, gdelt]   # search indexes only. A page watcher with nothing new
                              # answers ok-and-empty on every visit; with one watcher per name the
                              # page route would trip on every cycle (it already did on 25 and 28 Sep)
  rate_limits:
    default_seconds: 1.0
    googlenews_seconds: 2.0   # 4 Oct: 2.5 -> 2.0. Google News is the binding constraint: one host, serial spacing,
                              # so 13 minutes at 2.0 s is about 390 queries a run against ~350 due on the busiest cycle.
                              # The 429 penalty below widens it again automatically if Google objects.
    bing_seconds: 2.0
    gdelt_seconds: 6.0
    max_penalty_seconds: 60   # a host that answers 429 has its spacing widened, doubling from its
                              # own base up to this cap, and earns it back on clean responses.
                              # Without it each of ~100 GDELT jobs a run rediscovered the limit
                              # separately: 16 rate-limited responses in a single window.

routes:
  googlenews:
    enabled: true
    when: "1d"                # window for alias queries
    site_when: "7d"           # window for site-restricted outlet queries
    site_every_n_runs: 12     # 4 Oct: 6 -> 12. Per-name site: queries spread over 12 runs (each outlet every 3 hours); they use a 7-day window, so nothing is lost
    cold_start_when: "30d"    # window used for site: queries during the first two cycles (history for the golden set)
    group_size: 6             # names per grouped (OR) market query (comps, and the tier-A safety net)
    # v2 cadences. Every alias query looks back a full day ("when" above), so how often a query runs
    # sets latency, not completeness; what costs completeness is a query that never runs or a result
    # page that fills up. Focus credits (config/focus.yaml) get the short cadences.
    home_every_n_runs: 2      # tier-A solo query in the home market: every 30 minutes (focus credits: every run)
    foreign_every_n_runs: 6   # tier-A solo query in every other market: every 90 minutes (was grouped only until v2)
    focus_every_n_runs: 2     # focus credits: every market every 30 minutes
    focus_alias_every_n_runs: 4    # focus credits' executives and secondary aliases: at least hourly
    focus_comp_every_n_runs: 4     # comps of focus credits: their own home-market query hourly, not only grouped
    alias_min_every_n_runs: 2      # other names' secondary aliases: at most every 30 minutes
    tier_a_group_every_n_runs: 4   # v2: grouped tier-A queries are now a safety net behind the solos
    comp_every_n_runs: 3      # 4 Oct: 2 -> 3. Comp market groups every 3rd run; the 1-day query window still sees everything
    regulator_every_n_runs: 24  # v2: 12 -> 24. Home-country regulator site: sweeps; the watchers cover the venues
    # Names whose headline volume fills Google's 100-item cap on their own. They are grouped
    # among themselves, so they can only truncate each other, never the five light names that
    # used to share their query (on 4 Oct nine groups returned exactly 100 items on every run).
    heavy_names: [nike, amazon, booking, expedia, disneyparks, paypal, adidas, abfoods, action, adecco, pfizer, bayer, unilever, gsk, enterprise]
  bingnews:
    enabled: true             # 11 Oct (v2): back on as a narrow lane. Off as a broad sweep since 4 Oct (its breaker
                              # tripped every run, 132 of 296 queries never completed, 3,300 items against Google's
                              # 118,000). Measured over the month to 10 Oct, what only Bing found on tier-A names was
                              # Baltic press on airBaltic, including the EUR 140m first financing tranche (nra.lv,
                              # 29 Sep). It now runs tier A only, in the Baltic markets, in its own lane.
    countries: [LV, LT, EE]
    tier_a_only: true
    every_n_runs: 1
    comp_every_n_runs: 4
  gdelt:
    enabled: false            # 4 Oct: off. 190 completed of 1,365 attempts in 24h, zero items, HTTP 429
                              # and 6-second spacing that kept jobs queued past the budget.
    timespan: "24h"
    every_n_runs: 2           # tier-A gdelt groups rotate over 2 runs
    comp_every_n_runs: 4
    per_lang: false
  rss:
    enabled: true
    discover_per_run: 8      # at most this many outlets get feed discovery per run
    discover_retry_hours: 24  # an outlet without a feed is retried at most daily
  pages:
    enabled: true
    every_n_runs: 1           # v2: every newsroom every cycle (they run in the main lane, off the Google host)
    backfill_seed_items: 5    # first visit under --backfill-days: keep only the newest N article
                              # links per page instead of the whole archive (-1 = everything)

export:
  out_dir: docs               # served by GitHub Pages when Pages is set to "main branch / docs"
  window_hours: 24            # latest.json covers the last 24h of first-seen items
  window72: true              # v2: also write docs/window72.json, a compact 72-hour list of candidates
                              # and churn echoes, so the Monday cut covers the weekend
  keep_days: 90
  health_runs: 4

alerts:
  enabled: false              # set true and provide a webhook (Slack-compatible) or SMTP to push Tier-1 candidates
  lookback_hours: 24
  webhook_url: ""             # or env NEWSFLOW_WEBHOOK_URL
  smtp:
    host: ""
    port: 587
    user: ""
    password_env: NEWSFLOW_SMTP_PASSWORD
    from: ""
    to: []
