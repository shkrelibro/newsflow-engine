  # --- Re-daters and churn, added 13 September 2026 -------------------------------------------
  # These republish a wire story or auto-generate commentary under a fresh timestamp, so a stale
  # fact arrives looking like news. They were named in the editorial checklist for months and
  # never encoded here, which is why the tier-A tape kept being led by its own junk. Measured on
  # the 24 hours to 12:53Z: these domains supplied 96 of 488 name-bearing clusters, 20%.
  # Screened items are still stored and counted; they are simply not published.
  - media.unisba.ac.id      # 18 Oct: video-title spam ("Happy Gilmore 2 Full Movie ... Tui Uk Summer Booking Revenue")
  - news.inbox.eu           # every airBaltic row it carried was a re-date
  - liepajniekiem.lv        # 4 Oct: four re-dated airBaltic wires in one week (Reuters 16 Jul, the August EUR 225m,
                            # the 30 Jul Treasury mandate, the January S&P move), each with a fresh date
  - tipranks.com
  - marketbeat.com          # 14
  - themarketsdaily.com
  - tickerreport.com
  - dailypolitical.com
  - kalkinemedia.com
  - etfdailynews.com
  - wkrb13.com
  - modernreaders.com

  # --- Product listings and shopping copy ------------------------------------------------------
  # Consumer-brand comps (Nike, Adidas, Skechers, Boots, Dyson) attract retail listing pages that
  # carry the brand in the title and nothing else. 40 clusters from one domain in a day.
  - fuelcarmagazine.com     # 40, the single largest domain in the whole name-bearing book
  - highsnobiety.com
  - hypebeast.com
  - shopping.yahoo.com
  - gofeminin.de
  - thetraveler.org
  - joyn.de

# --- Churn sites, demoted rather than dropped (v2, 11 October 2026) ------------------------------
# These re-date and rewrite real news, so a row from them is never published as the source. But on
# a small credit they are often the engine's only trace that something happened: on 10 October 2026
# they carried the failed Branicks shareholder vote and Vonovia's Berlin construction stop (from a
# Welt am Sonntag interview) while the brief showed neither. Their rows are now screened under the
# reason "churn" instead of "noise_domain"; scripts/build_brief.py reads them as echoes and offers
# the event for judgement with the low-grade and date-unverified tags, never as a primary source.
demote_domains:
  - ad-hoc-news.de
  - boerse-global.de
  - boerse-express.com
  - boerse-express.de
  - finanztrends.de
  - kapitalmarktexperten.de

title_patterns:
  - "^Erste Schätzungen"
  - "Aktie: Quartalszahlen am"
  - "Osinkohistoria"
  - "Tilinpäätös -"
  - "uutiset ja -analyysit"
  - "Stock Price"
  - "Share Price"
  - "Dividend History"
  - "Kursziel"
  - "Chartanalyse"
  - "Technical Analysis"
  - "Teknisk analys"
  - "^Ähnliche Kennzahlen"
  - "Aktiekurs, analyser"
  - "Uhr, Lang & Schwarz"
  # phishing warnings about fake collection e-mails: brand abuse, not credit news (turn off if wanted)
  - "valse (e-)?mails?"
  - "phishing"
  - "nepincasso"
  - "oplichters"
  - "Betrügerische Inkassoschreiben"

  # --- Retail promotion and listing headlines, added 13 September 2026 -------------------------
  # MediaMarkt and Saturn generate deal-of-the-day copy daily; it carries Ceconomy's brands and
  # is never a credit event.
  - "on sale for"
  - "discount code"
  - "promo code"
  - "coupon"
  - "Best Shoes For"
  - "^Top .*-Deal"
  - "Angebot sticht heraus"
  - "coolen Angebote"
  - "mahlt den Preis"
  - "statt [0-9]+ Euro"

  # --- Auto-generated intraday blurbs, added 5 October 2026 ----------------------------------
  # finanzen.net, finanzen.ch and finanzen.at write "Südzucker Aktie News: Südzucker am
  # Montagnachmittag gesucht" by machine every few hours; five of them sat in one name's pile on
  # 5 October. The format is theirs alone; their reported stories do not carry it.
  - "Aktie News: "
  # TradingView's generated metric pages ("Tangible book value per share of BRANICKS Group AG TEMP – XETR:BRN"),
  # which a name on watch would otherwise keep from the domain screen.
  - " per share of .+ [–-] [A-Z]+:[A-Z0-9]+"
  - "^(?:Enterprise value|Market cap|Price to book|EV/EBITDA|Dividend yield) of .+ [–-] [A-Z]+:[A-Z0-9]+"

# --- Outlets whose dates must be verified (v2.15, 18 October 2026) --------------------------------
# Their Google News rows have carried old articles under the day Google found them: Latvian Public
# Media's English desk (a 1 April and a 6 July article led the brief on 18 October), liepajniekiem.lv
# (a 25 August LETA wire arrived on 16 October), Orange Actualites (old BFM and Challenges clips).
# The rows are kept, flagged "re-dater domain, date unverified", and the lint refuses to publish one
# until the writer has confirmed the date on the outlet's own page and tagged it "date verified".
verify_date_domains:
  - eng.lsm.lv
  - liepajniekiem.lv
  - actu.orange.fr
  - news.inbox.eu
