[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsflow-engine"
version = "0.1.0"
description = "Acquisition engine for a multi-language credit newsflow: fetch, normalise, dedupe, match, store, export."
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
newsflow = "newsflow.cli:main"

[tool.setuptools.packages.find]
include = ["newsflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
